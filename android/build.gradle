group 'io.carius.lars.ar_flutter_plugin'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'io.carius.lars.ar_flutter_plugin'
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        compileSdk 34
        minSdkVersion 24
    }
    // Added for compatibility issues
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Set Java source to 17
        targetCompatibility JavaVersion.VERSION_17 // Set Java target to 17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "com.google.ar:core:1.50.0"

    implementation 'com.google.ar.sceneform:core:1.17.1'
    implementation 'com.google.ar.sceneform:assets:1.17.1'

    implementation "com.google.android.gms:play-services-auth:16+"
    implementation "com.google.ar.sceneform.ux:sceneform-ux:1.17.1"
    implementation "androidx.appcompat:appcompat:1.3.0"
    // Extra imports
    implementation "com.google.guava:guava:31.1-android"
    implementation "androidx.core:core-ktx:1.12.0"
    // ARCore Sceneform (for 3D rendering)
    implementation "com.google.ar.sceneform.ux:sceneform-ux:1.17.1"
    implementation "com.google.ar.sceneform:animation:1.17.1"
    implementation "com.google.ar.sceneform:rendering:1.17.1"

}
